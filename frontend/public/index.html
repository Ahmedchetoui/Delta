    <!-- Meta Pixel Code (Queue immediate, script deferred to idle time to unblock main thread) -->
    <script>
      window.fbq = window.fbq || function() {
        if (window.fbq.callMethod) {
          window.fbq.callMethod.apply(window.fbq, arguments);
        } else {
          window.fbq.queue.push(arguments);
        }
      };
      if (!window._fbq) window._fbq = window.fbq;
      window.fbq.push = window.fbq;
      window.fbq.loaded = true;
      window.fbq.version = '2.0';
      window.fbq.queue = [];
      window.fbq('init', '1362539488813579');
      window.fbq('track', 'PageView');

      function loadFbPixel() {
        if (window._fbLoaded) return;
        window._fbLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://connect.facebook.net/en_US/fbevents.js';
        var first = document.getElementsByTagName('script')[0];
        first.parentNode.insertBefore(s, first);
      }

      if ('requestIdleCallback' in window) {
        requestIdleCallback(function() {
          setTimeout(loadFbPixel, 1800);
        });
      } else {
        window.addEventListener('load', function() {
          setTimeout(loadFbPixel, 1800);
        });
      }
    </script>

    <style>
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        transition: opacity 0.3s ease;
      }
      #initial-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #initial-splash .spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 3px solid #e5e7eb;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <noscript>Vous devez activer JavaScript pour utiliser cette application.</noscript>
    <div id="initial-splash" aria-hidden="true"><div class="spinner"></div></div>
    <div id="root"></div>
    <script>
      window.addEventListener('DOMContentLoaded', function () {
        var splash = document.getElementById('initial-splash');
        if (!splash) return;
        var hide = function () {
          splash.classList.add('hidden');
          setTimeout(function () { splash.remove(); }, 350);
        };
        if (document.getElementById('root').childElementCount > 0) hide();
        var observer = new MutationObserver(function () {
          if (document.getElementById('root').childElementCount > 0) {
            hide();
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      });
    </script>
  </body>
