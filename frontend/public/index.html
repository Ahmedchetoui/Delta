    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Unified Google Fonts with preconnect -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap">

    <!-- Deferred Initializer (Splash & Meta Pixel) -->
    <script defer src="%PUBLIC_URL%/init.js"></script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1362539488813579&ev=PageView&noscript=1"
    alt="" /></noscript>

    <title>Delta Fashion - Votre style, notre passion</title>
    <style>
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        transition: opacity 0.3s ease;
      }
      #initial-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #initial-splash .spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 3px solid #e5e7eb;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <noscript>Vous devez activer JavaScript pour utiliser cette application.</noscript>
    <div id="initial-splash" aria-hidden="true"><div class="spinner"></div></div>
    <div id="root"></div>
  </body>
</html>
