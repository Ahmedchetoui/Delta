name: Keep Render Backend Alive

on:
  schedule:
    # Exécuté toutes les 10 minutes (évite la mise en veille de Render)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permet aussi de déclencher manuellement depuis GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          curl -s -f https://delta-n5d8.onrender.com/api/health || echo "Ping failed or server sleeping"
