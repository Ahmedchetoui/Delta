name: Keep Render Backend Alive

on:
  schedule:
    # Marge suffisante avant le délai de veille éventuel de Render.
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permet le déclenchement manuel depuis GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          BACKEND_URL="https://delta-n5d8.onrender.com/api/health"
          MAX_RETRIES=3
          TIMEOUT=120
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) KeepAliveBot/1.0"

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Tentative $attempt/$MAX_RETRIES - Ping $BACKEND_URL"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -A "$USER_AGENT" -L --max-time $TIMEOUT "$BACKEND_URL" || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Backend en ligne (HTTP $HTTP_CODE)"
              exit 0
            fi
            
            echo "⏳ Réponse HTTP $HTTP_CODE - Le serveur se réveille..."
            
            if [ "$attempt" -lt "$MAX_RETRIES" ]; then
              echo "Attente de 10 secondes..."
              sleep 10
            fi
          done

          echo "⚠️ Le serveur a répondu HTTP $HTTP_CODE"
          exit 1
